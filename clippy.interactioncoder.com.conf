# Nginx vhost for Clippy — /etc/nginx/sites-available/clippy.interactioncoder.com.conf
# Symlink into sites-enabled, then: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name clippy.interactioncoder.com;

    # ACME challenges keep working over plain HTTP for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24: http2 is a listen parameter. On 1.25.1+ this becomes
    # a separate "http2 on;" directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clippy.interactioncoder.com;

    # Wildcard certificate for *.interactioncoder.com
    ssl_certificate     /etc/letsencrypt/live/interactioncoder.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/interactioncoder.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # No ssl_stapling: Let's Encrypt no longer publishes OCSP responses and
    # its certificates carry no OCSP URL, so nginx would only log a warning.

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Image pastes are base64 data URIs; the Express JSON limit is 20 MB,
    # so allow some headroom for the JSON envelope.
    client_max_body_size 25m;

    access_log /var/log/nginx/clippy.access.log;
    error_log  /var/log/nginx/clippy.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
}
